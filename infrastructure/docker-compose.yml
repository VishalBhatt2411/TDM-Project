services:
  postgres:
    image: postgres:16-alpine
    container_name: tdm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tdm
      POSTGRES_PASSWORD: tdm_dev_password
      POSTGRES_DB: tdm_operational
    ports:
      - "5432:5432"
    volumes:
      - tdm_postgres_data:/var/lib/postgresql/data

volumes:
  tdm_postgres_data:
